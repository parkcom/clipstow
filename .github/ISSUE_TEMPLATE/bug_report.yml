name: Bug report
description: Report a reproducible ClipStow problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private notes and clipboard content before submitting.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.6.1
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: ClipStow version or commit
      placeholder: v0.1.0-beta.1 or commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: List the smallest reliable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if useful.
